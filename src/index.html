<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACREDITA-BACH · Plan de estudio</title>
<meta name="description" content="Plan de estudio diario para el examen ACREDITA-BACH (Ceneval): repetición espaciada, práctica activa y simulacros.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1ebe0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">

<!-- Se precargan las dos caras que aparecen en el primer pintado: la sans de
     la interfaz y la serif con la que se componen los titulares. -->
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{CSS}}">

<script>
  /* Aplica el tema guardado antes del primer pintado para que no haya parpadeo.
     Se guarda en su propia llave: NUNCA toca el progreso (acreditabach_v1). */
  (function () {
    try {
      var t = localStorage.getItem("acreditabach_theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app">
  <div class="boot" aria-hidden="true">
    <div class="boot-mark"></div>
  </div>
</div>

<noscript>
  <div style="max-width:34rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;line-height:1.6">
    <h1>Necesitas activar JavaScript</h1>
    <p>Este plan de estudio funciona por completo en tu navegador (tu avance se guarda en este dispositivo),
       así que necesita JavaScript activado para mostrarte las tarjetas, los simulacros y tu progreso.</p>
  </div>
</noscript>

<!-- Temario y contenido informativo (globals: AREA_META, INFO_SECTIONS, AREA*_TOPICS) -->
{{DATA_SCRIPTS}}

<!-- App -->
<script type="module" src="{{JS}}"></script>
</body>
</html>
