name: Publicar en GitHub Pages

# La página se actualiza sola: cada push a la rama principal compila la app
# y la publica. También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega uno nuevo, el anterior se cancela.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar el temario (data/*.js)
        run: npm run validate

      - name: Probar los generadores de reactivos
        run: npm run test:generadores

      - name: Compilar la app
        run: npm run build

      - name: Avisar si el build commiteado quedó desfasado
        continue-on-error: true
        run: |
          if ! git diff --quiet -- index.html assets; then
            echo "::warning::El index.html/assets del repositorio no coinciden con el build actual."
            echo "Se publica el build recién compilado. Para sincronizar el repo: npm run build && git commit."
          fi

      - name: Armar el sitio estático
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r index.html icon.svg manifest.webmanifest .nojekyll assets data fonts _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    # Solo la rama por defecto publica; las demás únicamente compilan y validan.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement: true deja Pages configurado para publicar desde Actions
      # aunque el repositorio estuviera publicando desde una rama.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
